<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Abrir pedido no Elétrica OS</title>
  <style>
    /* Visual do design system "Kit de Cotação". */
    :root {
      --page:#f4f6f8; --surface:#ffffff; --surface-info:#fcfcfc; --surface-head:#f8f9fa;
      --brand:#1b1b87; --on-brand:#ffffff; --on-brand-muted:#cdd2f2; --eco:#1e5220; --on-eco:#ffffff;
      --ink:#333333; --ink-strong:#222222; --ink-muted:#555555; --ink-subtle:#666666;
      --border:#eaeaea; --border-card:#e0e6ed; --divider:#f0f0f0;
      --font-sans:"Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius-container:12px; --radius-card:10px; --shadow-container:0 8px 24px rgba(0,0,0,0.08);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: var(--font-sans); background: var(--page); color: var(--ink); font-size: 14px; line-height: 1.6; }
    .container { max-width: 520px; margin: 0 auto; padding: 20px 15px; }
    .caixa { background: var(--surface); border-radius: var(--radius-container); box-shadow: var(--shadow-container); overflow: hidden; }
    header { background: var(--brand); padding: 25px 30px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: .5px; color: var(--on-brand); }
    header p { margin: 5px 0 0; font-size: 13px; color: var(--on-brand-muted); }
    .info { background: var(--surface-info); border-bottom: 1px solid var(--border); padding: 15px 30px; display: grid; gap: 4px; }
    .info .rot { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--ink-subtle); }
    .info .nome { font-size: 15px; font-weight: 700; color: var(--ink-strong); }
    .info .sec { color: var(--ink-muted); }
    .corpo { padding: 25px 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn { display:block; text-align: center; text-decoration:none; border-radius: var(--radius-card); padding: 15px; font: inherit; font-size: 16px; font-weight: 700; width: 100%; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand); }
    .btn.sec { background: var(--surface); color: var(--ink-strong); border-color: var(--border-card); font-size: 14px; padding: 12px; }
    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .nota { margin: 5px 0 0; font-size: 12px; color: var(--ink-subtle); text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="caixa">
      <header>
        <h1>Novo pedido de serviço</h1>
        <p id="meta">Elétrica OS &nbsp;|&nbsp; Ordem de serviço</p>
      </header>
      <div class="info" id="resumo">Carregando…</div>
      <div class="corpo">
        <a class="btn" id="abrir" href="#">Abrir no app Elétrica OS</a>
        <button class="btn sec" id="copiar" type="button">Copiar pedido</button>
        <p class="nota">Se o app não abrir, toque em Copiar pedido e use Importar pedido dentro do app.</p>
      </div>
    </div>
  </div>
  <script>
  'use strict';
  (function () {
    var d = new URLSearchParams(location.search).get('d') || '';
    var esc = function (s) { return String(s || '').replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
    var resumo = document.getElementById('resumo');
    try {
      var b = d.replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var p = JSON.parse(new TextDecoder().decode(bytes));
      var urg = { urgente: ' | Urgente', emergencia: ' | Emergência' }[p.s.u] || '';
      resumo.innerHTML = '<span class="rot">' + esc(p.s.tp) + esc(urg) + '</span>' +
        '<span class="nome">' + esc(p.c.n) + '</span>' +
        '<span class="sec">' + esc(p.c.t) + ' | ' + esc([p.c.e, p.c.b, p.c.ci].filter(Boolean).join(', ')) + '</span>' +
        (p.s.d ? '<span>' + esc(p.s.d) + '</span>' : '');
    } catch (e) {
      resumo.textContent = 'Este pedido está incompleto. Peça ao cliente para enviar de novo pelo formulário.';
    }
    var intent = 'intent://import?d=' + d + '#Intent;scheme=eletricaos;package=br.com.judman.eletricaos;end';
    var direto = 'eletricaos://import?d=' + d;
    document.getElementById('abrir').href = /android/i.test(navigator.userAgent) ? intent : direto;
    document.getElementById('copiar').addEventListener('click', function () {
      var t = location.href;
      var botao = this;
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { botao.textContent = 'Pedido copiado'; });
      else prompt('Copie o link:', t);
    });
  })();
  </script>
</body>
</html>
